<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docomen</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f1f5f9;
    padding: 20px;
  }
  h1 {
    font-size: 2rem;
    text-align: center;
    margin-bottom: 24px;
    color: #1e293b;
  }
  .form-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.9rem;
    color: #334155;
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
  }
  a {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
</style>
</head>
<body>

<h1>กรอกข้อมูล</h1>

<div class="form-box">
  <label for="name">ชื่อ</label>
  <input type="text" id="name" placeholder="กรอกชื่อของคุณ">

  <label for="email">อีเมล</label>
  <input type="email" id="email" placeholder="กรอกอีเมล">

  <label for="message">ข้อความ</label>
  <textarea id="message" rows="4" placeholder="กรอกข้อความ"></textarea>
  <a href="pang2.HTML">ส่งข้อมูล</a>
</div>

<script>
function submitForm() {
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const message = document.getElementById('message').value;
  alert('ชื่อ: ' + name + '\nอีเมล: ' + email + '\nข้อความ: ' + message);
}
</script>
</body>
</html>
